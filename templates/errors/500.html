{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}

{% block content %}
<section class="card narrow error-page">
  <p class="error-code">500</p>
  <h1>Something went wrong on our side</h1>
  <p class="muted">Please try again in a moment. If it keeps happening, let the admin know.</p>
  <a class="btn btn-primary" href="{{ url_for('courses.home') }}">Go to the home page</a>
</section>
{% endblock %}
