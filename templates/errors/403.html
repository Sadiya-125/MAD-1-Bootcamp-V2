{% extends "base.html" %}
{% block title %}Access denied{% endblock %}

{% block content %}
<section class="card narrow error-page">
  <p class="error-code">403</p>
  <h1>Access denied</h1>
  <p class="muted">Your account doesn't have permission to view this page.</p>
  <a class="btn btn-primary" href="{{ url_for('auth.dashboard') if current_user else url_for('auth.login') }}">Go back</a>
</section>
{% endblock %}
