{% extends "base.html" %}
{% block title %}Register · CourseHub{% endblock %}
{% block content %}
  <h1>Create an account</h1>
  <form method="post" class="card">
    <label>Username
      <input name="username" value="{{ form.get('username', '') }}" required>
    </label>
    <label>Email
      <input type="email" name="email" value="{{ form.get('email', '') }}" required>
    </label>
    <label>Password
      <input type="password" name="password" minlength="8" required>
    </label>
    <label>Confirm password
      <input type="password" name="confirm" minlength="8" required>
    </label>
    <label>I want to
      <select name="role">
        <option value="student" {% if form.get('role') != 'instructor' %}selected{% endif %}>Learn (student)</option>
        <option value="instructor" {% if form.get('role') == 'instructor' %}selected{% endif %}>Teach (instructor)</option>
      </select>
    </label>
    <button type="submit">Register</button>
  </form>
  <p>Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
