{% extends "base.html" %}
{% block title %}Log in · CourseHub{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <form method="post" class="card">
    <label>Username
      <input name="username" value="{{ username }}" required>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
  <p>New here? <a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}
